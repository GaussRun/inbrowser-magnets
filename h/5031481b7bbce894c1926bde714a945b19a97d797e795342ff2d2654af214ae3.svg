<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-label="Priority bands: which hosts the reader asks first">
<title>Priority bands: which hosts the reader asks first</title>
<rect width="720" height="328" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="16" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Priority bands: lower runs earlier</text><rect x="16" y="48" width="46" height="24" rx="4" fill="rgb(170,230,200)"/><text x="39" y="64" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">10</text><text x="72" y="64" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">Blossom servers, nsite gateways</text><text x="704" y="64" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">hash in the URL, no signup</text><rect x="16" y="78" width="46" height="24" rx="4" fill="rgb(160,220,190)"/><text x="39" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">12</text><text x="72" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">Arweave gateways by txid (a:)</text><text x="704" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">permanent, free under 107,520 bytes</text><rect x="16" y="108" width="46" height="24" rx="4" fill="rgb(150,210,180)"/><text x="39" y="124" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">14</text><text x="72" y="124" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">Software Heritage</text><text x="704" y="124" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">archive, content by sha256</text><rect x="16" y="138" width="46" height="24" rx="4" fill="rgb(140,200,170)"/><text x="39" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">16</text><text x="72" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">Nostr relays (kind 30023, kind 1063)</text><text x="704" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">active module, loaded on demand</text><rect x="16" y="168" width="46" height="24" rx="4" fill="rgb(130,190,160)"/><text x="39" y="184" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">20</text><text x="72" y="184" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">owner host (o:), literal URLs (u:)</text><text x="704" y="184" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">the author's own domain</text><rect x="16" y="198" width="46" height="24" rx="4" fill="rgb(120,180,150)"/><text x="39" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">30</text><text x="72" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">GitHub raw, jsDelivr, Statically (g:), templates (t:)</text><text x="704" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">one public repo, four front doors</text><rect x="16" y="228" width="46" height="24" rx="4" fill="rgb(110,170,140)"/><text x="39" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">40</text><text x="72" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">IPFS gateways (?format=raw)</text><text x="704" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">kept on principle, slow for fresh blocks</text><rect x="16" y="258" width="46" height="24" rx="4" fill="rgb(100,160,130)"/><text x="39" y="274" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">50</text><text x="72" y="274" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">Bluesky PDS blob (b:)</text><text x="704" y="274" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">active module</text><rect x="16" y="288" width="46" height="24" rx="4" fill="rgb(90,150,120)"/><text x="39" y="304" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">60</text><text x="72" y="304" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">Arweave GraphQL by Content-SHA256 tag</text><text x="704" y="304" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="end">slow lookup when no txid is known</text>
</svg>
