<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-label="Time to a rendered page when the first address is dead: refused versus blackholed, Chromium 156 and Firefox 157">
<title>Time to a rendered page when the first address is dead: refused versus blackholed, Chromium 156 and Firefox 157</title>
<rect width="720" height="334" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="16" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Time to a rendered page when the first DNS address is dead</text><line x1="398" y1="44" x2="398" y2="284" stroke="#e3e3e3"/><text x="398" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">10 ms</text><line x1="466" y1="44" x2="466" y2="284" stroke="#e3e3e3"/><text x="466" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">100 ms</text><line x1="534" y1="44" x2="534" y2="284" stroke="#e3e3e3"/><text x="534" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">1 s</text><line x1="602" y1="44" x2="602" y2="284" stroke="#e3e3e3"/><text x="602" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">10 s</text><line x1="670" y1="44" x2="670" y2="284" stroke="#e3e3e3"/><text x="670" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">100 s</text><text x="322" y="65" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Chromium 156, first address refused</text><rect x="330" y="54" width="110.4" height="14" rx="3" fill="#1a7f4b"/><text x="446.4" y="65" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">42 ms</text><text x="322" y="91" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Chromium 156, first address blackholed</text><rect x="330" y="80" width="172.1" height="14" rx="3" fill="#1a7f4b"/><text x="508.1" y="91" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">340 ms</text><text x="322" y="117" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Chromium 156, two blackholed addresses</text><rect x="330" y="106" width="331.5" height="14" rx="3" fill="#c0392b"/><text x="667.5" y="117" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">75.1 s</text><text x="322" y="143" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Chromium 156 + HappyEyeballsV3, two blackholed (IPv6)</text><rect x="330" y="132" width="186.2" height="14" rx="3" fill="#1a7f4b"/><text x="522.2" y="143" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">547 ms</text><text x="322" y="169" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Firefox 157, first address refused</text><rect x="330" y="158" width="163.2" height="14" rx="3" fill="#1a7f4b"/><text x="499.2" y="169" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">251 ms</text><text x="322" y="195" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Firefox 157, first address blackholed (IPv4)</text><rect x="330" y="184" width="331.6" height="14" rx="3" fill="#c0392b"/><text x="667.6" y="195" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">75.3 s</text><text x="322" y="221" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Firefox 157, two blackholed addresses</text><rect x="330" y="210" width="331.6" height="14" rx="3" fill="#c0392b"/><text x="667.6" y="221" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">75.3 s</text><text x="322" y="247" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Firefox 157 + happy_eyeballs pref, first blackholed</text><rect x="330" y="236" width="169.4" height="14" rx="3" fill="#1a7f4b"/><text x="505.4" y="247" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">310 ms</text><text x="322" y="273" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Firefox 157 + happy_eyeballs pref, two blackholed</text><rect x="330" y="262" width="177.7" height="14" rx="3" fill="#1a7f4b"/><text x="513.7" y="273" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">411 ms</text><text x="16" y="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368">Log scale. Local lab, macOS, DNS over HTTPS to a fake zone; 75 s is the OS connect timeout (net.inet.tcp.keepinit).</text>
