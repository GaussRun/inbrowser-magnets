<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="The race: three Blossom servers at 0 ms, Arweave and Nostr at 300 ms, the owner host and GitHub later; the first verified copy wins">
<title>The race: three Blossom servers at 0 ms, Arweave and Nostr at 300 ms, the owner host and GitHub later; the first verified copy wins</title>
<rect width="720" height="286" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="16" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">The race, schematically</text><text x="250" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5f6368">3 tasks at 0 ms, 2 more every 300 ms, first verified copy wins, the rest are aborted</text><line x1="250" y1="42" x2="250" y2="256" stroke="#e3e3e3"/><text x="250" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">0 ms</text><line x1="360" y1="42" x2="360" y2="256" stroke="#e3e3e3"/><text x="360" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">300 ms</text><line x1="470" y1="42" x2="470" y2="256" stroke="#e3e3e3"/><text x="470" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">600 ms</text><line x1="580" y1="42" x2="580" y2="256" stroke="#e3e3e3"/><text x="580" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">900 ms</text><line x1="690" y1="42" x2="690" y2="256" stroke="#e3e3e3"/><text x="690" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5f6368" text-anchor="middle">1200 ms</text><text x="242" y="63" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">nostr.download (Blossom)</text><rect x="250" y="52" width="69.66666666666666" height="14" rx="3" fill="#1a7f4b"/><text x="325.66666666666663" y="63" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a7f4b">won</text><text x="242" y="89" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">blossom.ditto.pub (